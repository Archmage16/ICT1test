services:
  - type: web
    name: olympiq-ux-sprint
    runtime: python
    plan: free
    region: frankfurt
    repo: https://github.com/Archmage16/ICT1test
    branch: ux-sprint-render
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate --noinput && python manage.py prepare_ux_demo
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /
    autoDeployTrigger: off
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.12
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: OLYMPIQ_UX_DEMO
        value: "true"
      - key: DB_ENGINE
        value: django.db.backends.postgresql
      - key: DB_NAME
        fromDatabase:
          name: olympiq-ux-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: olympiq-ux-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: olympiq-ux-db
          property: password
      - key: DB_HOST
        fromDatabase:
          name: olympiq-ux-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: olympiq-ux-db
          property: port

databases:
  - name: olympiq-ux-db
    databaseName: olympiq_ux
    user: olympiq_ux
    plan: free
    region: frankfurt
    ipAllowList: []
