{% load ux %}
{% for error in form.non_field_errors %}<div class="message error">{{ error|tr }}</div>{% endfor %}
{% for field in form %}<div class="form-field"><label for="{{ field.id_for_label }}">{{ field.label|tr }}{% if field.field.required %} *{% endif %}</label>{{ field }}{% if field.help_text %}<span class="helptext">{{ field.help_text|tr|safe }}</span>{% endif %}{% for error in field.errors %}<div class="message error">{{ error|tr }}</div>{% endfor %}</div>{% endfor %}
